<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="diagram-data" class="diagram-svg" width="1520" height="1000" viewBox="0 0 1520 1000" role="img" aria-labelledby="data-title data-desc">
<title id="data-title">Aurora SFP loopback: hardware data path</title><desc id="data-desc">One ZCU670 FPGA contains a frame generator, a golden-reference FIFO, a frame checker, two Aurora cores and ILA. Aurora 0 transmits payload through SFP0 and an external duplex cable to Aurora 1 on SFP1. Aurora 1 supplies the checker. Its transmit application interface is idle. Both transceivers use normal mode 000.</desc>
<defs><style>
svg { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#fff; }
text { fill:#172a3d; font-size:17px; }
.title { font-size:24px; font-weight:650; letter-spacing:-.02em; }
.heading { font-size:20px; font-weight:620; }
.small { font-size:15px; fill:#596b7d; }
.tiny { font-size:13px; fill:#596b7d; }
.mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14px; }
.scope { fill:#fafcfe; stroke:#b9c9d7; stroke-width:1.5; }
.nodebox { fill:#fff; stroke:#bdcedb; stroke-width:1.5; }
.payloadbox { fill:#f0faf7; stroke:#a0cfc0; }
.clockbox { fill:#fff9ed; stroke:#ddc99b; }
.controlbox { fill:#f7f2fc; stroke:#cfbfe3; }
.statusbox { fill:#f2f6fb; stroke:#b7c8da; }
.cagebox { fill:#eef6fb; stroke:#9dbdd2; }
.banner { fill:#eef4f8; }
.divider { stroke:#dbe4ec; stroke-width:1; }
.data { fill:none; stroke:#007d73; stroke-width:3.2; stroke-linejoin:round; }
.ready { fill:none; stroke:#007d73; stroke-width:1.7; stroke-dasharray:5 4; }
.clock { fill:none; stroke:#a56a06; stroke-width:2.4; stroke-linejoin:round; }
.control { fill:none; stroke:#7350b4; stroke-width:2.4; stroke-linejoin:round; }
.status { fill:none; stroke:#61788f; stroke-width:2; stroke-linejoin:round; }
.serial { fill:none; stroke:#176b8b; stroke-width:2.6; stroke-linejoin:round; }
.label { font-size:14px; fill:#486174; paint-order:stroke; stroke:#fff; stroke-width:5; stroke-linejoin:round; }
.port { font-size:13px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; fill:#486174; }
.selected .nodebox { stroke:#007d73; stroke-width:3; }
a { cursor:pointer; text-decoration:none; }
a:hover .nodebox { stroke:#4a8e9c; stroke-width:2.5; }
a:focus-visible { outline:3px solid #168dcd; outline-offset:4px; }
</style>
<marker id="data-data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#007d73"/></marker>
<marker id="data-clock-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a56a06"/></marker>
<marker id="data-control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7350b4"/></marker>
<marker id="data-status-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61788f"/></marker>
<marker id="data-serial-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#176b8b"/></marker>
</defs>
<rect x="0" y="0" width="1520" height="1000" rx="9" class="" fill="#fff" stroke="none"/>
<text x="36" y="43" class="title" >Hardware data path</text>
<text x="36" y="72" class="small" >Both Aurora endpoints are synthesized in the same FPGA. The cable connects the two SFP cages.</text>
<rect x="32" y="105" width="1154" height="815" rx="9" class="scope" />
<text x="54" y="137" class="mono" >ZCU670 FPGA · aurora_system_wrapper → aurora_system</text>
<text x="1230" y="178" class="small" >Board connectors</text>
<text x="1230" y="199" class="small" >+ external cable</text>
<path d="M330 278 H625" class="data" marker-end="url(#data-data-arrow)"/>
<text x="408" y="260" class="label" >64-bit AXI TX</text>
<path d="M625 315 H330" class="ready" marker-end="url(#data-data-arrow)"/>
<text x="415" y="338" class="label" >TREADY from Aurora 0</text>
<path d="M430 278 V430 H205 V480" class="data" marker-end="url(#data-data-arrow)"/>
<circle cx="430" cy="278" r="4" fill="#007d73"/>
<text x="79" y="454" class="label" >Monitor accepted TX words</text>
<path d="M575 530 H596 V555 H625" class="data" marker-end="url(#data-data-arrow)"/>
<path d="M625 630 H465 V785 H370" class="data" marker-end="url(#data-data-arrow)"/>
<text x="487" y="687" class="label" >RX AXIS</text>
<text x="487" y="709" class="tiny" >64-bit payload</text>
<path d="M205 645 V725" class="data" marker-end="url(#data-data-arrow)"/>
<text x="98" y="683" class="label" >REF_PORT</text>
<path d="M285 725 V645" class="ready" marker-end="url(#data-data-arrow)"/>
<text x="290" y="708" class="tiny" >ready</text>
<path d="M70 600 H50 V780 H70" class="status" marker-end="url(#data-status-arrow)"/>
<text x="41" y="690" class="tiny" transform="rotate(-90 41 690)" text-anchor="middle">overflow</text>
<path d="M370 825 H670" class="status" marker-end="url(#data-status-arrow)"/>
<text x="399" y="851" class="label" >Checker flags and counters</text>
<path d="M1145 278 H1220" class="data" marker-end="url(#data-data-arrow)"/>
<path d="M1220 345 H1145" class="serial" marker-end="url(#data-serial-arrow)"/>
<path d="M1145 555 H1220" class="serial" marker-end="url(#data-serial-arrow)"/>
<path d="M1220 625 H1145" class="data" marker-end="url(#data-data-arrow)"/>
<path d="M1400 278 H1480 V625 H1400" class="data" marker-end="url(#data-data-arrow)"/>
<path d="M1400 555 H1440 V345 H1400" class="serial" marker-end="url(#data-serial-arrow)"/>
<text x="1501" y="475" class="tiny" transform="rotate(-90 1501 475)" text-anchor="middle">SFP0 TX → SFP1 RX · payload</text>
<text x="1461" y="452" class="tiny" transform="rotate(-90 1461 452)" text-anchor="middle">SFP1 TX → SFP0 RX · link traffic</text>
<g><title>Frame generator — select to inspect connections</title>
<rect x="70" y="215" width="260" height="130" rx="9" class="nodebox payloadbox" />
<text x="89" y="247" class="heading" style="font-size:20.00px">Frame generator</text>
<text x="89" y="272" class="mono" style="font-size:14.00px">frame_generator_0</text>
<text x="89" y="302" class="small" style="font-size:14.08px">Counter data · 16 words/frame</text>
</g>
<g><title>Golden-reference FIFO — select to inspect connections</title>
<rect x="70" y="480" width="270" height="165" rx="9" class="nodebox payloadbox" />
<text x="89" y="512" class="heading" style="font-size:17.76px">Golden-reference FIFO</text>
<text x="89" y="537" class="mono" style="font-size:14.00px">golden_reference_fifo_0</text>
<text x="89" y="567" class="small" style="font-size:15.00px">Stores DATA / KEEP / LAST</text>
<text x="89" y="590" class="small" style="font-size:15.00px">256 words · passive monitor</text>
<text x="89" y="613" class="small" style="font-size:15.00px">Overflow is reported as error</text>
</g>
<g><title>Idle TX source — select to inspect connections</title>
<rect x="385" y="480" width="190" height="100" rx="9" class="nodebox statusbox" />
<text x="404" y="512" class="heading" style="font-size:18.50px">Idle TX source</text>
<text x="404" y="537" class="mono" style="font-size:14.00px">aurora_tx_idle_0</text>
<text x="404" y="567" class="small" style="font-size:15.00px">TVALID = 0</text>
</g>
<g><title>Frame checker — select to inspect connections</title>
<rect x="70" y="725" width="300" height="130" rx="9" class="nodebox payloadbox" />
<text x="89" y="757" class="heading" style="font-size:20.00px">Frame checker</text>
<text x="89" y="782" class="mono" style="font-size:14.00px">frame_checker_0</text>
<text x="89" y="812" class="small" style="font-size:15.00px">Compare RX with FIFO head</text>
</g>
<g><title>Aurora 0 · GTY X0Y0 — select to inspect connections</title>
<rect x="625" y="205" width="520" height="195" rx="9" class="nodebox" />
<text x="645" y="236" class="heading" >Aurora 0 · GTY X0Y0</text>
<text x="645" y="260" class="mono" >aurora_64b66b_0</text>
<text x="645" y="286" class="port" >S_AXIS_TX → Aurora TX → TXP/TXN</text>
<text x="645" y="341" class="small" >RX AXIS output unused</text>
<rect x="635" y="358" width="500" height="32" rx="9" class="banner" />
<text x="646" y="380" class="tiny" >Shared logic inside: reference buffer / QPLL / clocks</text>
</g>
<g><title>Aurora 1 · GTY X0Y1 — select to inspect connections</title>
<rect x="625" y="495" width="520" height="195" rx="9" class="nodebox" />
<text x="645" y="526" class="heading" >Aurora 1 · GTY X0Y1</text>
<text x="645" y="550" class="mono" >aurora_64b66b_1</text>
<text x="645" y="567" class="small" >TX application input held idle</text>
<text x="645" y="637" class="port" >M_AXIS_RX ← Aurora RX ← RXP/RXN</text>
<rect x="635" y="648" width="500" height="32" rx="9" class="banner" />
<text x="646" y="670" class="tiny" >Shared logic outside: support signals from Aurora 0</text>
</g>
<g><title>SFP0 connector and package pins — select to inspect connections</title>
<rect x="1220" y="225" width="180" height="160" rx="9" class="nodebox cagebox" />
<text x="1240" y="254" class="heading" >SFP0</text>
<text x="1240" y="282" class="mono" >TXP / TXN</text>
<text x="1240" y="303" class="tiny" >N30 / N31</text>
<text x="1240" y="347" class="mono" >RXP / RXN</text>
<text x="1240" y="368" class="tiny" >P33 / P34</text>
</g>
<g><title>SFP1 connector and package pins — select to inspect connections</title>
<rect x="1220" y="502" width="180" height="160" rx="9" class="nodebox cagebox" />
<text x="1240" y="531" class="heading" >SFP1</text>
<text x="1240" y="559" class="mono" >TXP / TXN</text>
<text x="1240" y="580" class="tiny" >L30 / L31</text>
<text x="1240" y="624" class="mono" >RXP / RXN</text>
<text x="1240" y="645" class="tiny" >M33 / M34</text>
</g>
<g><title>ILA status monitor — select to inspect connections</title>
<rect x="670" y="735" width="475" height="130" rx="9" class="nodebox statusbox" />
<text x="689" y="767" class="heading" style="font-size:20.00px">ILA status monitor</text>
<text x="689" y="792" class="mono" style="font-size:14.00px">ila_0 · 7 probes · 1024 samples</text>
<text x="689" y="822" class="small" style="font-size:15.00px">Channel status · app reset · checker flags/counters</text>
<text x="689" y="845" class="small" style="font-size:15.00px">FIFO overflow · sampled on user_clk_out</text>
</g>
<text x="1240" y="718" class="small" >Normal GTY operation</text>
<text x="1240" y="743" class="mono" >loopback = 3&#x27;b000</text>
<text x="1240" y="780" class="tiny" >Reverse serial traffic keeps</text>
<text x="1240" y="800" class="tiny" >the duplex link running;</text>
<text x="1240" y="820" class="tiny" >application TVALID stays 0.</text>
<rect x="70" y="877" width="1075" height="28" rx="9" class="banner" />
<text x="84" y="897" class="tiny" >Clock, startup reset, channel enable and fixed controls: open the Clock &amp; reset view.</text>
<text x="36" y="956" class="small" >The FIFO records the actual transmitted words; the checker does not regenerate the pattern.</text>
<text x="36" y="980" class="tiny" >Solid green: data path. Dashed green: ready handshake. Blue: reverse serial link. Grey: status.</text>
</svg>
